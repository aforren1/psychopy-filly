name: Build and release

# Every run builds the sdist and the wheel and runs the tests that need no display (code
# generation, the glTF name reader, and the vendor record of the web files) with each tested
# PsychoPy version. A pushed tag vX.Y.Z whose version matches pyproject.toml also publishes to
# PyPI. A manual run can publish to TestPyPI instead. Publishing uses PyPI trusted publishing:
# no token is stored here.
# The tests install filly from PyPI, so a release that needs a new filly API waits for that filly
# release.
on:
  workflow_dispatch:
    inputs:
      testpypi:
        description: Publish the build to TestPyPI
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: python
        run: |
          import os, tomllib
          with open("pyproject.toml", "rb") as file:
              version = tomllib.load(file)["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"]
          if tag != f"v{version}":
              raise SystemExit(f"Tag {tag} does not match version {version} in pyproject.toml")
      - name: Build the sdist and the wheel
        run: pipx run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        # The tested PsychoPy versions (docs/how-to/develop.md, "Test"). 2024.2.4 supports
        # Python 3.8 to 3.10, and filly needs 3.10 or later.
        include:
          - psychopy: '2024.2.4'
            python: '3.10'
          - psychopy: '2026.2.4'
            python: '3.11'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.0  # setup-uv publishes no major-version tags since v8
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Install the system libraries that filly and pyglet load
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libglu1-mesa xvfb
      - name: Test the built wheel
        run: |
          uv pip install --system --override tests/psychopy-overrides.txt dist/*.whl \
            "psychopy==${{ matrix.psychopy }}" "pytest>=8"
          # Run from the tests folder, so that the installed wheel is tested, not the source.
          cd tests
          xvfb-run -a python -m pytest -q test_codegen.py test_gltf_info.py

  publish:
    name: Publish to PyPI
    needs: [build, test]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/p/psychopy-filly
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, test]
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    runs-on: ubuntu-24.04
    environment:
      name: testpypi
      url: https://test.pypi.org/p/psychopy-filly
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
