[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psychopy-filly"
version = "0.0.1.dev0"
description = "PsychoPy Builder components that show 3D glTF models rendered with filly"
readme = "README.md"
# filly needs Python 3.10 or later. PsychoPy's own Python limits are PsychoPy's to declare.
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alex Forrence", email = "alex.forrence@gmail.com" }]
# The standalone app registers the "psychopy" distribution, so the requirement is already met
# there. 2024.2 is the first release with a Python 3.10 standalone install. The tested versions
# are in psychopy_filly.runtime.TESTED_PSYCHOPY, which warns at run time for others.
dependencies = ["filly>=0.2.0.dev0,<0.3", "numpy", "psychopy>=2024.2"]

[project.urls]
Homepage = "https://github.com/aforren1/psychopy-filly"
Documentation = "https://github.com/aforren1/psychopy-filly#readme"
Issues = "https://github.com/aforren1/psychopy-filly/issues"

[project.optional-dependencies]
tests = ["pytest>=8"]

[project.entry-points."psychopy.experiment.components"]
Scene3DComponent = "psychopy_filly.components.scene3d:Scene3DComponent"
Model3DComponent = "psychopy_filly.components.model3d:Model3DComponent"

[tool.setuptools.packages.find]
include = ["psychopy_filly*"]

[tool.setuptools.package-data]
"*" = ["*.png", "*.svg"]
# filly's web build and the PsychoJS runtime (tools/vendor_web.py).
psychopy_filly = ["web/*", "web/licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "display: needs a display, an OpenGL driver, filly, and PsychoPy",
  "browser: needs Node.js, npm install in tests/web, and a browser (see tests/test_web.py)",
]
